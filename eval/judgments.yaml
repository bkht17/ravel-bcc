# Ручная разметка точности: ключ находки → 1 (верно) / 0.5 (частично) / 0 (неверно, шум).
# Ключ — хэш (criterion, первая цитата), его печатает score.py; F-номера меняются между прогонами, ключ — нет.
# Находка без оценки здесь, но совпавшая с эталоном, считается верной (1); прочие — «без оценки».
# Пишите короткую причину в комментарии: по ней разметку можно пересмотреть.
#
# Это НАША разметка. Аудитор на тех же 11 находках samples/requirements.md поставил 8.5 / 11,
# его оценки по каждой находке нам не известны; когда появятся — заменить ими.

# --- samples/requirements.md, базовая линия -p none ---
d50bdcbb41: 1    # F-001 Изменение данных через GET
bec7078dab: 1    # F-002 Разные единицы сумм (тиыны / тенге)
791305cbc9: 1    # F-003 amount: integer в запросе, string в ответе
ee2fcf1c9a: 1    # F-004 enabled: integer в запросе, string в ответе
76378d55a4: 1    # F-005 Код 404 не объявлен в списке статусов
72cd704bbf: 1    # F-006 Код 200 назван «Created»
b4bb4042ec: 0.5  # F-007 «Ревью требований не заполнен»: это не заглушка, а пометка; суть (нет версии) не названа, отметки — дубль F-009
96a70c3a05: 1    # F-008 «Тестирование требований» — заглушка «заполняются тестировщиками»
edddcf99dd: 1    # F-009 Чек-лист ревью без отметок
c5675c4703: 1    # F-010 Content-Type при запросе без тела
348b1e050b: 1    # F-011 Пустой блок согласующих

