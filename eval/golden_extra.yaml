# Наши прежние записи эталона (G-xx из первой версии golden.yaml), которых нет в таблице аудитора.
# Формат — как в golden.yaml. Оценка: uv run python eval/score.py <report.json> --golden eval/golden_extra.yaml
#
# Остальные старые записи вошли в эталон аудитора и здесь не повторяются:
#   G-01 → K2   G-02 → K1   G-03 → S1   G-05 → S3   G-07 → S2/S6   G-08 → K3
#   G-10 → S8 (+ K5 частично)   G-11 → K6   G-12 → S7   G-14 → K3 (частично)   G-15 → K4

document: samples/requirements.md
source: наша первая разметка (до аудита)
tolerance: 3

entries:
