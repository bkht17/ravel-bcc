# Эталон eval/foreign/library.md — «чужой» документ: 9 абзацев без номеров, 7 ловушек как у аудитора.
# Формат — как в eval/golden.yaml. Абзацы стоят через строку, поэтому допуск по строкам 0:
# цитата должна быть из того самого абзаца.
# clean_lines — абзацы без дефектов: находка оттуда, не совпавшая с эталоном, — ложное срабатывание.

document: eval/foreign/library.md
source: наша копия проверки аудитора на чужом документе
tolerance: 0
clean_lines: [3]

entries:
  - id: L1
    weight: 1
    lines: [5, 13]
    what: Бронь держится 24 часа в одном абзаце и 48 часов в другом
    full:
      - ['@\b24\b', '@\b48\b']
      - ['\b24\b', '\b48\b', '@противореч|не совпада|расход|конфликт|несоглас|не соглас|несоответств|разн\w* (срок|значени|врем)']
    partial: []

  - id: L2
    weight: 1
    lines: [9]
    what: «Поиск должен работать быстро» — размыто и непроверяемо
    full:
      - ['быстро', '@неизмерим|непровер|размыт|нечетк|не (задан|указан|определ)\w*|субъектив|количествен|метрик|секунд|\bмс\b|миллисекунд|время (отклика|ответа)|неоднознач|толкован|измерим']
    partial: []

  - id: L3
    weight: 1
    lines: [7]
    what: Одно требование «выдать книгу, списать штраф и уведомить» — составное
    full:
      - ['@составн|несколько (требовани|действи|функци|операци)|раздел\w* на|разбить|разнести|единичн|атомарн|объединя|criterion=singular']
    partial: []

  - id: L4
    weight: 1
    lines: [11]
    what: Возврат книги описан без негативного сценария (не та книга, нет выдачи, повреждение, просрочка)
    full:
      - ['@возврат|возвращ|вернул|сда[ею]т|сдач', '@негативн|ошибк|исключени|альтернатив|поврежд|утер|потер|не найден|не числится|не выдава|чуж|просроч|штраф|не (описан|предусмотр|рассмотр)\w* (случа|сценари|ситуаци|вариант)']
    partial: []

  - id: L5
    weight: 1
    lines: [15]
    what: «Хранить в PostgreSQL» — проектное решение, а не требование
    full:
      - ['postgres', '@проектн|реализац|архитектур|техническ\w* (решени|детал)|избыточн|преждевремен|ограничива|уровн|не (является|относится)|criterion=(appropriate|necessary)']
    partial: []

  - id: L6
    weight: 1
    lines: [17]
    what: «Золотой читатель» не определён — требование нельзя проверить
    full:
      - ['золот', '@не (определ|описан|задан|раскрыт|указан)\w*|определени|критери|кто (так|счита|явля|получ)|неясно|неоднознач|термин|глоссари|непровер|как стать|статус']
    partial: []

  - id: L7
    weight: 1
    lines: [7, 19]
    what: SMS с датой возврата при выдаче требуется дважды разными словами
    full:
      - ['@дублир|дубл|повтор|избыточн|redundan|одно и то же|то же (само\w* )?требовани|те же|дважды']
    partial: []
