# Эталон eval/foreign/rooms.md — небанковская мини-спецификация для проверки обобщения промптов.
# Зафиксирован ДО первого прогона модели (27.11.2026) и после прогона не менялся.
# Заложено: одно противоречие (G1) и один пропуск (G2); абзацы 3, 9 и 13 — без дефектов.
# Формат — как в eval/golden.yaml; абзацы через строку, поэтому допуск по строкам 0.

document: eval/foreign/rooms.md
source: проверка обобщения (заранее зафиксированный эталон)
tolerance: 0
clean_lines: [3, 9, 13]

entries:
  - id: G1
    weight: 1
    lines: [5, 11]
    what: Бронь не дольше 2 часов, а пример с 10:00 до 13:00 (3 часа) создаётся успешно
    full:
      - ['@противореч|несоответств|расход|конфликт|не соглас|несоглас|наруш|превыша', '(\b2\b|двух) час|13:00|10:00|\b3\b час|тр(и|ех) час']
    partial: []

  - id: G2
    weight: 1
    lines: [7]
    what: Бронь снимается без подтверждения присутствия, но способ подтверждения нигде не описан
    full:
      - ['@подтвер', '@не (описан|определ|указан|задан)|способ|каким образом|как (именно )?(сотрудник )?подтвер|механизм|отсутству|неясно']
    partial: []
