# Эталон дефектов samples/requirements.md — 23 пункта аудита жюри (K1–K9 ключевые, S1–S14 второстепенные).
# Наши прежние записи, которых у аудитора нет, лежат в golden_extra.yaml.
#
# Формат записи (подробно — в eval/README.md):
#   lines       строки samples/requirements.md из таблицы аудитора; «39-40» — диапазон
#   also_lines  наши дополнительные строки-якоря (отступление от таблицы аудитора, с причиной в note)
#   full        альтернативы полного совпадения; partial — частичного (половина веса)
#   combine     true — частичные альтернативы, найденные хотя бы разными находками все вместе,
#               засчитываются как полное совпадение; число N — достаточно N разных из них
# Альтернатива — список регулярных выражений; находка подходит, если совпали ВСЕ.
# Текст находки: title + explanation + suggestion + цитаты, в нижнем регистре, «ё» → «е».
# Префикс «@» — выражение ищется только в словах агента (title/explanation/suggestion
# и метка «criterion=<критерий>»), без цитат: так цитата из документа не засчитывает чужую находку.
# Кроме того, хотя бы одна цитата находки должна стоять не дальше tolerance строк от lines/also_lines.

