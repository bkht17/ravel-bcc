# Эталон дефектов samples/requirements.md. Размечаем вдвоём независимо, потом сводим.
# Находка агента засчитывается, если в её цитатах + заголовке + пояснении встречаются
# ВСЕ слова из any_of[i] хотя бы для одного i (без учёта регистра).
- id: G-01
  what: Ф-2 (дата совершения) противоречит критерию приёмки №2 (покупка 31.01 идёт в февраль)
  any_of: [["совершения", "февраль"], ["31 января", "Ф-2"], ["23:58", "совершения"]]
- id: G-02
  what: Ф-3 «максимум один push в месяц» против Ф-4 «push независимо от истории»
  any_of: [["Ф-3", "Ф-4"], ["максимум один", "независимо"]]
- id: G-03
  what: Цель «в момент покупки» против НФТ «в течение минуты»
  any_of: [["момент покупки", "минуты"]]
- id: G-04
  what: НФТ меряет передачу на отправку, а не доставку push; нет метрики доступности
  any_of: [["в течение минуты", "достав"], ["передаёт push на отправку"]]
- id: G-05
  what: Суммы в тиынах, порог в тенге
  any_of: [["тиын", "тенге"]]
- id: G-06
  what: Не описано, что с отправленным push после возврата
  any_of: [["возврат", "push"]]
- id: G-07
  what: Покупки в иной валюте / только карта KZT — не описано
  any_of: [["kzt", "валют"]]
- id: G-08
  what: Сохранение через GET
  any_of: [["get", "сохран"], ["rest type", "get"]]
- id: G-09
  what: Description «Сохранение… чтение порога» противоречит сам себе
  any_of: [["чтение порога", "противореч"], ["description", "противореч"]]
- id: G-10
  what: 200 назван Created, ERROR приходит с 200
  any_of: [["200", "created"], ["error", "200"]]
- id: G-11
  what: 404 возвращается, но не объявлен
  any_of: [["404"]]
- id: G-12
  what: amount integer в запросе и string в ответе
  any_of: [["amount", "string"]]
- id: G-13
  what: Content-Type json при отсутствии тела
  any_of: [["content-type"]]
- id: G-14
  what: cardId в query-строке — риск ИБ (логи)
  any_of: [["cardid", "лог"], ["cardid", "query"], ["cardid", "url"]]
- id: G-15
  what: Нет метода чтения порога, хотя приложение «читает» настройки
  any_of: [["нет метода"], ["метод чтения"], ["отсутств", "чтени"]]
- id: G-16
  what: Нет Prod URL и Swagger
  any_of: [["prod"], ["swagger"]]
- id: G-17
  what: Раздел тестирования не заполнен
  any_of: [["заполняются тестировщиками"]]
- id: G-18
  what: Версия документа не заполнена, чек-лист ревью не проставлен
  any_of: [["версия"], ["да / нет"], ["чек-лист"]]
- id: G-19
  what: Блок согласующих пуст
  any_of: [["согласующ"]]
- id: G-20
  what: Нет схемы отката / скрытия функционала
  any_of: [["откат"]]
- id: G-21
  what: Не определён текст и содержание push / сообщения об ошибке в UI
  any_of: [["текст", "push"], ["сообщение", "под полем"]]
- id: G-22
  what: Ф-4 — неясно, что при выключении/включении уведомления (сброс признака отправки)
  any_of: [["выключ", "Ф-4"], ["enabled", "признак отправки"]]
